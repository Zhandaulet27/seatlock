name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # BookingConcurrencyTest is a real integration test - it hits actual
    # Postgres row locks and version-column checks, so it needs a real
    # database, not an in-memory stand-in. This spins one up as a sidecar
    # for the whole job, matching the DB name/credentials application.yml
    # already defaults to.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seatlock
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d seatlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Independently proves TCP + password auth works BEFORE Maven runs, so
      # a credentials problem shows up as one clear line here instead of
      # being buried at the bottom of a 10-minute Maven log. The service's
      # own health check (above) only proves the Postgres process is up, not
      # that these exact credentials work over TCP - pg_isready over the
      # local socket uses "trust" auth and never checks the password, so a
      # real auth mismatch can otherwise slip past a "healthy" service.
      - name: Verify Postgres connectivity
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U postgres -d seatlock -c "SELECT 1;"

      - name: Run tests
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn -B clean test

  deploy:
    needs: build-and-test
    # Only deploy on an actual push to main (not on pull_request builds,
    # and not if the tests above failed).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/seatlock
            git pull
            docker compose up --build -d
            # Old image layers pile up on the instance's small disk after
            # repeated redeploys - clear dangling ones each time.
            docker image prune -f
