name: seatlock

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - seatlock-db-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback only - reachable from the host itself (e.g. for
      # psql while debugging) but never exposed on the machine's public
      # network interface, regardless of firewall/security-group rules.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatlock"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    ports:
      # Loopback-only, same reasoning as db above - the public entry point
      # is Nginx on :80, not the app directly. You can still
      # "curl 127.0.0.1:8080/..." from inside the EC2 instance to debug.
      - "127.0.0.1:8080:8080"
    environment:
      # Overrides application.yml's localhost default so the app reaches
      # Postgres by its Compose service name ("db") instead.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/seatlock
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Falls back to the same dev-only secret already baked into
      # application.yml if you don't set JWT_SECRET yourself. On the EC2
      # deployment, set a real secret via a .env file next to this compose
      # file instead of relying on this fallback (see deploy notes).
      JWT_SECRET: ${JWT_SECRET:-rbIJlJntauPgwzJvZAYVHOO9/8QkGzPqI6Q5Q0fXsrQ=}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    # Multi-stage build (see nginx/Dockerfile): compiles the React app in a
    # throwaway Node stage, then bakes the static output + nginx.conf into a
    # plain nginx:1.27-alpine image. No volume mount needed anymore - the
    # image is self-contained and rebuilds like the app's own Dockerfile
    # does, so "docker compose up --build" always serves whatever's
    # currently in frontend/.
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      # The only publicly-reachable port. On EC2, only 22 and 80 should be
      # open in the instance's security group.
      - "80:80"
    depends_on:
      - app

volumes:
  seatlock-db-data:
