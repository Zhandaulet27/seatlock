# Reverse proxy for the SeatLock Spring Boot app.
#
# Nginx is the only service with a port published to the public internet
# (see docker-compose.yml + the EC2 security group, which only opens 22
# and 80). It forwards everything to the "app" service over the internal
# Compose network, using Compose's built-in DNS ("app" resolves to the
# app container's IP).

server {
    listen 80;
    server_name _;

    # Real client IP / protocol get forwarded so Spring's logs and any
    # future "X-Forwarded-*"-aware code see the real caller, not Nginx.
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't let a slow backend response hang the proxy connection
        # indefinitely.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
