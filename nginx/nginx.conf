# Reverse proxy + static file server for SeatLock.
#
# Nginx is the only service with a port published to the public internet
# (see docker-compose.yml + the EC2 security group, which only opens 22 and
# 80). It serves the built React app's static files directly and forwards
# API/docs traffic to the "app" service over the internal Compose network,
# using Compose's built-in DNS ("app" resolves to the app container's IP).
# Same origin for everything, so the frontend never makes a cross-origin
# request and the backend needs no CORS configuration at all.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real client IP / protocol get forwarded so Spring's logs and any
    # "X-Forwarded-*"-aware code see the real caller, not Nginx.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # OpenAPI/Swagger - kept reachable in production too, same as before
    # this app had a frontend claiming "/".
    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Everything else is the React app. try_files falls back to index.html
    # so React Router's client-side routes (e.g. a direct link or refresh on
    # /events/3) resolve correctly instead of 404ing at Nginx, which knows
    # nothing about client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
