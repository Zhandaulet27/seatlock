spring:
  application:
    name: seatlock

  datasource:
    url: jdbc:postgresql://localhost:5432/seatlock
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:zhan_1605}

  jpa:
    hibernate:
      # 'update' auto-adjusts tables to match your entities - convenient while learning,
      # but not something you'd trust in a real production app (that's what Phase-later
      # tools like Flyway/Liquibase are for). Fine for now.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  # A real deployment would set JWT_SECRET as an actual environment variable
  # (never commit a real production secret to git) - this default is a
  # randomly generated 256-bit key that's fine for local development.
  secret: ${JWT_SECRET:rbIJlJntauPgwzJvZAYVHOO9/8QkGzPqI6Q5Q0fXsrQ=}
  expiration-ms: 86400000 # 24 hours
